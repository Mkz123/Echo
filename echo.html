const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0], W: [0, 0] };
const WALL_CELL = { wall: true, plate: -1, door: -1, inv: false, exit: false, gate: -1 };

function parseLevel(def) {
  const rows = def.map, h = rows.length, w = rows[0].length;
  const cells = [], doors = [], plates = [], boxes = [], timedPlates = [], gates = [];
  let start = null, exit = null;
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x] || '#';
      const c = { wall: false, plate: -1, door: -1, inv: false, exit: false, gate: -1 };
      if (ch === '#') c.wall = true;
      else if (ch === 'S') start = [x, y];
      else if (ch === 'E') { c.exit = true; exit = [x, y]; }
      else if ('abcd'.includes(ch)) { c.plate = 'abcd'.indexOf(ch); plates.push([x, y]); }
      else if ('ABCD'.includes(ch)) { c.door = 'ABCD'.indexOf(ch); doors.push([x, y]); }
      else if ('1234'.includes(ch)) { c.door = '1234'.indexOf(ch); c.inv = true; doors.push([x, y]); }
      else if (ch === 'o') boxes.push([x, y]);
      else if (ch === 'G') { c.gate = gates.length; gates.push([x, y]); }
      else if ('xyzw'.includes(ch)) { c.plate = 'xyzw'.indexOf(ch); c.timed = true; plates.push([x, y]); timedPlates.push([x, y]); }
      row.push(c);
    }
    cells.push(row);
  }
  const walk = moves => {
    const route = [exit.slice()];
    for (const m of moves) { const p = route[route.length - 1], d = DIRS[m]; route.push([p[0] + d[0], p[1] + d[1]]); }
    return route;
  };
  const future = (def.future || []).map(walk);
  return { name: def.name, ch: def.ch, intro: def.intro, tutorial: !!def.tutorial, finale: !!def.finale, farewell: !!def.farewell, futurePress: !!def.futurePress, autoWait: !!def.autoWait, futureSay: def.futureSay || [], tape: def.tape || [], hint: def.hint, hintAfter: def.hintAfter, T: def.T, selves: def.selves, timer: def.timer || 3, w, h, cells, start, exit, doors, plates, boxes, timedPlates, gates, future };
}
function futureArrived(L, s) { return L.future.every((r, j) => s.falive[j] && s.fidx[j] === r.length - 1); }

function cellAt(L, x, y) {
  if (y < 0 || y >= L.h || x < 0 || x >= L.w) return WALL_CELL;
  return L.cells[y][x];
}
function doorOpen(c, pressed) { return c.inv ? !pressed[c.door] : pressed[c.door]; }
function posAt(path, t) { return path[Math.min(t, path.length - 1)]; }

function boxIndex(boxes, x, y) {
  for (let i = 0; i < boxes.length; i++) if (boxes[i][0] === x && boxes[i][1] === y) return i;
  return -1;
}
function boxCanEnter(L, boxes, x, y, occupied) {
  const c = cellAt(L, x, y);
  if (c.wall || c.door >= 0 || c.exit || c.gate >= 0) return false;
  if (boxIndex(boxes, x, y) >= 0) return false;
  return !occupied.some(p => p[0] === x && p[1] === y);
}

// A ghost standing in a door that is closed at tick t is a paradox: it is erased,
// which releases its plates and can cascade into further paradoxes.
// `pressed[k]` means colour k is active: a hold plate is occupied or its timer is running.
function settle(L, ghosts, gpos, alive, boxes, pp, t, events, timer, extra = []) {
  const hold = (x, y) => { const c = cellAt(L, x, y); return c.plate >= 0 && !c.timed ? c.plate : -1; };
  let pressed;
  for (;;) {
    pressed = timer.map(v => v > 0);
    for (let i = 0; i < ghosts.length; i++) {
      if (!alive[i]) continue;
      const k = hold(gpos[i][0], gpos[i][1]);
      if (k >= 0) pressed[k] = true;
    }
    const pk = hold(pp[0], pp[1]);
    if (pk >= 0) pressed[pk] = true;
    for (const q of extra) {
      const k = hold(q[0], q[1]);
      if (k >= 0) pressed[k] = true;
    }
    for (const b of boxes) {
      const k = hold(b[0], b[1]);
      if (k >= 0) pressed[k] = true;
    }
    let changed = false;
    for (let i = 0; i < ghosts.length; i++) {
      if (!alive[i]) continue;
      const c = cellAt(L, gpos[i][0], gpos[i][1]);
      if (c.door >= 0 && !doorOpen(c, pressed)) {
        alive[i] = false;
        events.push({ ghost: i, t, pos: gpos[i], kind: 'door' });
        changed = true;
      }
    }
    if (!changed) break;
  }
  return pressed;
}

function timedOccupancy(L, gpos, alive, boxes, pp) {
  return L.timedPlates.map(([x, y]) =>
    (pp[0] === x && pp[1] === y) ||
    gpos.some((p, i) => alive[i] && p[0] === x && p[1] === y) ||
    boxIndex(boxes, x, y) >= 0);
}

function initialState(L, ghosts, pp) {
  const boxes = L.boxes.map(b => b.slice());
  const alive = ghosts.map(() => true);
  const gpos = ghosts.map(g => posAt(g, 0));
  const events = [];
  const tocc = timedOccupancy(L, gpos, alive, boxes, pp);
  const timer = [0, 0, 0, 0];
  const pressed = settle(L, ghosts, gpos, alive, boxes, pp, 0, events, timer);
  const gateUse = L.gates.map(() => null);
  const fidx = L.future.map(() => 0), falive = L.future.map(() => true);
  return { t: 0, gpos, alive, boxes, pressed, pp, events, timer, tocc, gateUse, fidx, falive };
}

// Movers resolve in a fixed order (ghosts by age, then the present) so a replayed
// ghost sees exactly the world it saw when it was recorded, unless the present
// changed something. A ghost whose recorded push is now blocked is a paradox.
// Timed plates fire only on the tick something arrives on them; standing still does not extend them.
// Returns null when the present's own move is illegal, unless `force` is set.
function stepState(L, ghosts, prev, pp, force) {
  const t = prev.t + 1;
  const alive = prev.alive.slice();
  const boxes = prev.boxes.map(b => b.slice());
  const gpos = prev.gpos.slice();
  const gateUse = prev.gateUse.slice();
  const events = [];
  for (let i = 0; i < ghosts.length; i++) {
    const from = gpos[i], to = posAt(ghosts[i], t);
    gpos[i] = to;
    if (!alive[i]) continue;
    const dx = to[0] - from[0], dy = to[1] - from[1];
    if (!dx && !dy) continue;
    const gc = cellAt(L, to[0], to[1]).gate;
    if (gc >= 0) {
      if (gateUse[gc] !== null && gateUse[gc] !== 'g' + i) {
        alive[i] = false;
        events.push({ ghost: i, t, pos: from, kind: 'gate' });
        continue;
      }
      gateUse[gc] = 'g' + i;
    }
    const bi = boxIndex(boxes, to[0], to[1]);
    if (bi < 0) continue;
    const occ = gpos.filter((p, j) => j !== i && alive[j]).concat([prev.pp]);
    if (boxCanEnter(L, boxes, to[0] + dx, to[1] + dy, occ)) boxes[bi] = [to[0] + dx, to[1] + dy];
    else { alive[i] = false; events.push({ ghost: i, t, pos: from, kind: 'box' }); }
  }
  const dx = pp[0] - prev.pp[0], dy = pp[1] - prev.pp[1];
  if (dx || dy) {
    const bi = boxIndex(boxes, pp[0], pp[1]);
    if (bi >= 0) {
      const occ = gpos.filter((p, j) => alive[j]);
      if (boxCanEnter(L, boxes, pp[0] + dx, pp[1] + dy, occ)) boxes[bi] = [pp[0] + dx, pp[1] + dy];
      else if (!force) return null;
    }
  }
  if (dx || dy) {
    const gc = cellAt(L, pp[0], pp[1]).gate;
    if (gc >= 0) {
      if (gateUse[gc] !== null && gateUse[gc] !== 'p') { if (!force) return null; }
      else gateUse[gc] = 'p';
    }
  }
  const tocc = timedOccupancy(L, gpos, alive, boxes, pp);
  const timer = prev.timer.map(v => Math.max(0, v - 1));
  L.timedPlates.forEach(([x, y], j) => {
    if (tocc[j] && !prev.tocc[j]) timer[cellAt(L, x, y).plate] = L.timer;
  });
  // Gold walkers move after the world settles, so with futurePress the plate one stands on
  // only counts from the following tick.
  const extra = L.futurePress ? L.future.map((r, j) => (prev.falive[j] ? r[prev.fidx[j]] : null)).filter(Boolean) : [];
  const pressed = settle(L, ghosts, gpos, alive, boxes, pp, t, events, timer, extra);
  // A gold walker follows a fixed route but waits at closed doors instead of walking into them.
  const fidx = prev.fidx.slice(), falive = prev.falive.slice();
  L.future.forEach((route, j) => {
    if (!falive[j]) return;
    if (fidx[j] < route.length - 1) {
      const [nx, ny] = route[fidx[j] + 1], c = cellAt(L, nx, ny);
      if (!(c.door >= 0 && !doorOpen(c, pressed)) && boxIndex(boxes, nx, ny) < 0) fidx[j]++;
    }
    const [x, y] = route[fidx[j]], c = cellAt(L, x, y);
    if (c.door >= 0 && !doorOpen(c, pressed)) {
      falive[j] = false;
      events.push({ ghost: -1, future: j, t, pos: [x, y], kind: 'future' });
    }
  });
  const pc = cellAt(L, pp[0], pp[1]);
  if (!force && pc.door >= 0 && !doorOpen(pc, pressed)) return null;
  return { t, gpos, alive, boxes, pressed, pp, events, timer, tocc, gateUse, fidx, falive };
}
function simulate(L, ghosts, present) {
  const states = [initialState(L, ghosts, present[0])];
  for (let t = 1; t < present.length; t++) states.push(stepState(L, ghosts, states[t - 1], present[t], true));
  return states;
}

// With `guard` on, a move that would erase a past self is refused and the paradox is reported instead.
function checkMove(L, ghosts, present, states, dir, guard = true) {
  const t = present.length - 1;
  if (t >= L.T) return { ok: false, why: 'time' };
  const d = DIRS[dir], cur = present[t];
  const tg = [cur[0] + d[0], cur[1] + d[1]];
  if (cellAt(L, tg[0], tg[1]).wall) return { ok: false, why: 'wall' };
  // A gate's single ticket is decided by whoever enters first, so a future
  // conflict with a past self has to be caught now, not on the tick it happens.
  const gc = cellAt(L, tg[0], tg[1]).gate, use = gc >= 0 ? states[t].gateUse[gc] : null;
  if (gc >= 0 && use === null && guard) {
    for (let i = 0; i < ghosts.length; i++) {
      if (!states[t].alive[i]) continue;
      const g = ghosts[i];
      for (let k = t + 1; k < g.length; k++) {
        const entering = cellAt(L, g[k][0], g[k][1]).gate === gc && !(g[k - 1][0] === g[k][0] && g[k - 1][1] === g[k][1]);
        if (entering) return { ok: false, why: 'paradox', events: [{ ghost: i, t: k, pos: g[k], kind: 'gate' }] };
      }
    }
  }
  if (gc >= 0 && use !== null && use !== 'p') return { ok: false, why: 'gate' };
  const s = stepState(L, ghosts, states[t], tg, false);
  if (!s) return { ok: false, why: 'blocked' };
  if (guard && s.events.length) return { ok: false, why: 'paradox', events: s.events };
  if (cellAt(L, tg[0], tg[1]).exit && !futureArrived(L, s)) return { ok: false, why: 'future' };
  return { ok: true, tg };
}

function tryMove(L, ghosts, present, states, dir, guard = true) {
  const r = checkMove(L, ghosts, present, states, dir, guard);
  return r.ok ? r.tg : null;
}// CORE-END

let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();

}
function tone(f0, dur, type = 'sine', vol = 0.1, f1 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol) {

  const buf = AC.createBuffer(1, len, AC.sampleRate);

  const src = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();

// ================= Drawing =================
function layout() {
  const L = G.L, topH = 130, botH = 140;
  const cs = Math.floor(Math.min((VW - 60) / L.w, (VH - topH - botH) / L.h, 76));
  const ox = Math.floor((VW - cs * L.w) / 2);
  const oy = Math.floor(topH + (VH - topH - botH - cs * L.h) / 2);
  return { cs, ox, oy };
}

function nearFloor(L, x, y) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const c = cellAt(L, x + dx, y + dy);
    if (!c.wall) return true;
  }
  return false;
}

function drawPolyline(pts, upto, color, width, dash) {
  if (pts.length < 2 || upto <= 0) return;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  const full = Math.min(Math.floor(upto), pts.length - 1);
  for (let i = 1; i <= full; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  const k = upto - Math.floor(upto);
  if (full < pts.length - 1 && k > 0) {
    const a = pts[full], b = pts[full + 1];
    ctx.lineTo(lerp(a[0], b[0], k), lerp(a[1], b[1], k));
  }
  ctx.stroke();
  ctx.restore();
}

function drawScene(f, lay, now, dt) {
  const { cs, ox, oy } = lay, L = G.L, st = G.states;
  const ti = clamp(Math.round(f), 0, st.length - 1), S = st[ti];
  const C = (x, y) => [ox + (x + 0.5) * cs, oy + (y + 0.5) * cs];

  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const c = L.cells[y][x], px = ox + x * cs, py = oy + y * cs;
    if (c.wall) {
      if (!nearFloor(L, x, y)) continue;
      ctx.fillStyle = '#0a0d15'; ctx.fillRect(px, py, cs, cs);
      ctx.fillStyle = 'rgba(255,255,255,0.025)';
      for (let k = 1; k < 4; k++) ctx.fillRect(px, py + (k * cs) / 4, cs, 1);
    } else {
      ctx.fillStyle = (x + y) & 1 ? '#1a2234' : '#1d263a';
      ctx.fillRect(px, py, cs, cs);
      ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1; ctx.strokeRect(px + 0.5, py + 0.5, cs - 1, cs - 1);
    }
  }

  // exit portal: stays dim until the gold walker has arrived
  {
    const [ex, ey] = C(L.exit[0], L.exit[1]), lit = futureArrived(L, S) ? 1 : 0.25;
    const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, cs * 0.6);
    g.addColorStop(0, `rgba(160,230,255,${0.35 * lit})`); g.addColorStop(1, 'rgba(160,230,255,0)');
    ctx.fillStyle = g; ctx.fillRect(ex - cs, ey - cs, cs * 2, cs * 2);
    for (let k = 0; k < 3; k++) {
      const r = cs * (0.12 + 0.1 * k) + Math.sin(now / 300 + k * 1.3) * cs * 0.025 * lit;
      ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,240,255,${(0.8 - 0.22 * k) * lit})`; ctx.lineWidth = 2; ctx.stroke();
    }
  }

  // plates
  for (const [x, y] of L.plates) {
    const c = L.cells[y][x], col = PLATE_COL[c.plate];
    const [cx, cy] = C(x, y);
    if (c.timed) {
      const left = S.timer[c.plate], on = left > 0, r = cs * 0.3;
      ctx.save();
      if (on) { ctx.shadowColor = col; ctx.shadowBlur = 24; }
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = on ? rgba(col, 0.25) : rgba(col, 0.1); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = rgba(col, 0.6); ctx.stroke();
      ctx.restore();
      if (on) {
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r - 3, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * left) / L.timer);
        ctx.closePath(); ctx.fillStyle = rgba(col, 0.85); ctx.fill();
      } else {
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - r * 0.6); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * 0.45, cy); ctx.stroke();
      }
      continue;
    }
    const on = S.pressed[c.plate] && !blackout(), s = cs * (on ? 0.52 : 0.6);
    ctx.save();
    if (on) { ctx.shadowColor = col; ctx.shadowBlur = 24; }
    rr(cx - s / 2, cy - s / 2, s, s, cs * 0.1);
    ctx.fillStyle = on ? rgba(col, 0.9) : rgba(col, 0.12); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke();
    ctx.restore();
  }

  // doors
  for (const [x, y] of L.doors) {
    const c = L.cells[y][x], key = x + ',' + y, open = doorOpen(c, S.pressed) && !blackout() ? 1 : 0;
    let a = G.doorAnim[key];
    if (a === undefined) a = open;
    a += (open - a) * Math.min(1, dt * 14);
    G.doorAnim[key] = a;
    const px = ox + x * cs, py = oy + y * cs, col = PLATE_COL[c.door];
    ctx.save();
    ctx.strokeStyle = rgba(col, 0.4); ctx.lineWidth = 1.5;
    if (c.inv) ctx.setLineDash([4, 3]);
    ctx.strokeRect(px + 3.5, py + 3.5, cs - 7, cs - 7);
    ctx.restore();
    if (c.inv) {
      ctx.save();
      ctx.beginPath(); ctx.rect(px + 4, py + 4, cs - 8, cs - 8); ctx.clip();
      ctx.strokeStyle = rgba(col, 0.13); ctx.lineWidth = cs * 0.07;
      for (let k = -cs; k < cs * 2; k += cs * 0.22) { ctx.beginPath(); ctx.moveTo(px + k, py); ctx.lineTo(px + k + cs, py + cs); ctx.stroke(); }
      ctx.restore();
    }
    const half = (cs - 8) / 2, w = half * (1 - a);
    if (w > 0.5) {
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 14 * (1 - a);
      ctx.fillStyle = rgba(col, 0.85);
      ctx.fillRect(px + 4, py + 4, w, cs - 8);
      ctx.fillRect(px + cs - 4 - w, py + 4, w, cs - 8);
      ctx.restore();
      ctx.save();
      ctx.beginPath(); ctx.rect(px + 4, py + 4, w, cs - 8); ctx.rect(px + cs - 4 - w, py + 4, w, cs - 8); ctx.clip();
      if (c.inv) {
        ctx.strokeStyle = 'rgba(10,13,20,0.55)'; ctx.lineWidth = cs * 0.07;
        for (let k = -cs; k < cs * 2; k += cs * 0.22) { ctx.beginPath(); ctx.moveTo(px + k, py); ctx.lineTo(px + k + cs, py + cs); ctx.stroke(); }
      } else {
        ctx.fillStyle = 'rgba(10,13,20,0.35)';
        for (let k = 1; k < 4; k++) ctx.fillRect(px, py + 4 + (k * (cs - 8)) / 4 - 1, cs, 2);
      }
      ctx.restore();
    }
  }

  // ticket gates
  L.gates.forEach(([x, y], j) => {
    const px = ox + x * cs, py = oy + y * cs, used = S.gateUse[j] !== null;
    const col = used ? '#ff6b6b' : '#ffd28a';
    ctx.fillStyle = rgba(col, 0.08); ctx.fillRect(px + 3, py + 3, cs - 6, cs - 6);
    ctx.fillStyle = rgba(col, 0.9);
    ctx.fillRect(px + 5, py + 6, 5, cs - 12);
    ctx.fillRect(px + cs - 10, py + 6, 5, cs - 12);
    ctx.fillRect(px + 10, py + cs / 2 - 2, cs - 20, 4);
    if (used) {
      const m = cs * 0.3;
      ctx.strokeStyle = rgba(col, 0.9); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(px + m, py + m); ctx.lineTo(px + cs - m, py + cs - m);
      ctx.moveTo(px + cs - m, py + m); ctx.lineTo(px + m, py + cs - m); ctx.stroke();
    } else {
      ctx.fillStyle = rgba(col, 0.9); ctx.font = `600 ${Math.max(10, Math.round(cs * 0.2))}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('1', px + cs / 2, py + cs * 0.27);
    }
  });

  // boxes
  {
    const bl = Math.floor(f), bk = f - bl;
    const B0 = st[clamp(bl, 0, st.length - 1)], B1 = st[clamp(bl + 1, 0, st.length - 1)];
    B0.boxes.forEach((b, j) => {
      const b1 = B1.boxes[j];
      const [cx, cy] = C(lerp(b[0], b1[0], bk), lerp(b[1], b1[1], bk));
      const s = cs * 0.76, x = cx - s / 2, y = cy - s / 2;
      ctx.fillStyle = '#8a6a43'; ctx.fillRect(x, y, s, s);
      ctx.strokeStyle = '#c79a5e'; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, s - 3, s - 3);
      ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + s - 4, y + s - 4); ctx.moveTo(x + s - 4, y + 4); ctx.lineTo(x + 4, y + s - 4);
      ctx.lineWidth = 2; ctx.stroke();
    });
  }

  // look-ahead hints: what happens next tick if you just wait
  if (G.mode === 'play' && ti === curTick() && ti < L.T) {
    const nx = stepState(L, G.ghosts, S, G.present[ti], true);
    const pulse = 0.5 + 0.5 * Math.sin(now / 160);
    for (const [x, y] of L.doors) {
      const c = L.cells[y][x], a = doorOpen(c, S.pressed), b = doorOpen(c, nx.pressed);
      if (a === b) continue;
      const px = ox + x * cs, py = oy + y * cs;
      ctx.save();
      ctx.strokeStyle = `rgba(255,255,255,${0.35 + 0.5 * pulse})`; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.strokeRect(px + 1, py + 1, cs - 2, cs - 2);
      ctx.restore();
      ctx.fillStyle = '#ffffff'; ctx.font = `600 ${Math.max(10, Math.round(cs * 0.2))}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(b ? '下一步开' : '下一步关', px + cs / 2, py - 2);
    }
    for (const ev of nx.events) {
      const [cx, cy] = C(ev.pos[0], ev.pos[1]);
      ctx.fillStyle = `rgba(255,90,140,${0.5 + 0.5 * pulse})`;
      ctx.font = `800 ${Math.round(cs * 0.4)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', cx, cy - cs * 0.48);
    }
  }

  // tutorial target marker
  if (L.tutorial && G.mode === 'play') {
    const tg = tutTarget(tutStage());
    if (tg) {
      const px = ox + tg[0] * cs, py = oy + tg[1] * cs, pulse = 0.5 + 0.5 * Math.sin(now / 200);
      const m = 2 - pulse * 4, len = cs * 0.28;
      ctx.strokeStyle = `rgba(255,224,138,${0.55 + 0.45 * pulse})`; ctx.lineWidth = 3;
      for (const [sx, sy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
        const x = px + (sx ? cs - m : m), y = py + (sy ? cs - m : m), dx = sx ? -len : len, dy = sy ? -len : len;
        ctx.beginPath(); ctx.moveTo(x + dx, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy); ctx.stroke();
      }
    }
  }

  // trails
  G.ghosts.forEach((g, i) => {
    const col = GHOST_COL[i % GHOST_COL.length];
    const pts = g.map(p => C(p[0], p[1]));
    let death = Infinity;
    for (let t = 0; t < st.length; t++) if (!st[t].alive[i]) { death = t; break; }
    if (death === Infinity) drawPolyline(pts, pts.length - 1, rgba(col, 0.2), 2, [3, 6]);
    drawPolyline(pts, Math.min(f, death), rgba(col, 0.45), 3);
    if (death !== Infinity && f >= death) {
      const [dx, dy] = C(...posAt(g, death));
      ctx.strokeStyle = rgba(col, 0.8); ctx.lineWidth = 2.5;
      const r = cs * 0.14;
      ctx.beginPath(); ctx.moveTo(dx - r, dy - r); ctx.lineTo(dx + r, dy + r); ctx.moveTo(dx + r, dy - r); ctx.lineTo(dx - r, dy + r); ctx.stroke();
    }
  });
  drawPolyline(G.present.map(p => C(p[0], p[1])), f, 'rgba(255,255,255,0.28)', 3);
  const fl = Math.floor(f), k = f - fl;
  const A0 = st[clamp(fl, 0, st.length - 1)], A1 = st[clamp(fl + 1, 0, st.length - 1)];
  L.future.forEach((route, j) => {
    if (G.mode === 'farewell') return;
    const pts = route.map(p => C(p[0], p[1]));
    // the last level keeps her route secret until she walks it
    if (!L.farewell) drawPolyline(pts, pts.length - 1, rgba(FUTURE_COL, 0.2), 2, [3, 6]);
    drawPolyline(pts, lerp(A0.fidx[j], A1.fidx[j], k), rgba(FUTURE_COL, 0.45), 3);
    if (!futureArrived(L, S) && !L.farewell) {
      const [dx, dy] = pts[pts.length - 1], pulse = 0.5 + 0.5 * Math.sin(now / 300);
      ctx.save();
      ctx.beginPath(); ctx.arc(dx, dy, cs * (0.36 + 0.03 * pulse), 0, Math.PI * 2);
      ctx.strokeStyle = rgba(FUTURE_COL, 0.35 + 0.3 * pulse); ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke();
      ctx.restore();
    }
  });

  // where each ghost goes next
  if (G.mode === 'play') {
    G.ghosts.forEach((g, i) => {
      if (!S.alive[i]) return;
      const a = posAt(g, ti), b = posAt(g, ti + 1);
      if (a[0] === b[0] && a[1] === b[1]) return;
      const [cx, cy] = C(b[0], b[1]);
      ctx.beginPath(); ctx.arc(cx, cy, cs * 0.12, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(GHOST_COL[i % GHOST_COL.length], 0.7); ctx.lineWidth = 2; ctx.stroke();
    });
  }

  const items = [];
  G.ghosts.forEach((g, i) => {
    if (!S.alive[i]) return;
    const a = posAt(g, fl), b = posAt(g, fl + 1), p = posAt(g, ti);
    items.push({ x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), moving: a[0] !== b[0] || a[1] !== b[1], key: p.join(), col: GHOST_COL[i % GHOST_COL.length], face: facingAt(g, fl + 1), seed: i });
  });
  const fw = G.mode === 'farewell' ? G.fw : null;
  L.future.forEach((route, j) => {
    if (!S.falive[j]) return;
    const a = route[A0.fidx[j]], b = route[A1.fidx[j]], p = route[S.fidx[j]];
    const fade = fw && fw.waved ? clamp((now - fw.waved - WAVE_HOLD_MS) / FADE_MS, 0, 1) : 0;
    items.push({ x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), moving: !same(a, b), key: p.join(), human: true, waving: !!fw, alpha: 1 - fade, seed: 7 + j });
  });
  {
    const P = G.present, n = P.length - 1;
    const a = P[Math.min(fl, n)], b = P[Math.min(fl + 1, n)], p = P[Math.min(ti, n)];
    const it = { x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), moving: a[0] !== b[0] || a[1] !== b[1], key: p.join(), present: true, face: facingAt(P, Math.min(fl + 1, n)) };
    // once out of the door, 47 turns round to look back at her
    if (fw && now - fw.start > 500) it.face = [-1, 0];
    if (fw && fw.waved) it.hop = now - fw.waved;
    items.push(it);
  }
  const groups = {};
  items.forEach(it => { (groups[it.key] = groups[it.key] || []).push(it); });
  Object.values(groups).forEach(arr => {
    if (arr.length < 2) return;
    arr.forEach((it, j) => {
      const ang = (j / arr.length) * Math.PI * 2 - Math.PI / 2;
      it.ox = Math.cos(ang) * 0.15; it.oy = Math.sin(ang) * 0.15;
    });
  });
  for (const it of items) {
    let [cx, cy] = C(it.x + (it.ox || 0), it.y + (it.oy || 0));
    if (it.moving) cy -= Math.sin(k * Math.PI) * cs * 0.08;
    if (it.present && G.bump && now - G.bump.time < 160) {
      const p = 1 - (now - G.bump.time) / 160, d = DIRS[G.bump.dir];
      cx += d[0] * 5 * p * Math.sin(p * 9); cy += d[1] * 5 * p * Math.sin(p * 9);
    }
    const r = cs * 0.27;
    if (it.human) drawHuman(cx, cy, r, it, now); else drawRobot(cx, cy, r, it, now);
  }
  // countdowns sit on top so whoever stands in the door or on the clock plate can't hide them
  for (const [x, y] of L.doors) {
    const c = L.cells[y][x];
    if (S.timer[c.door] > 0) drawCountBadge(ox + x * cs, oy + y * cs, cs, S.timer[c.door], PLATE_COL[c.door]);
  }
  for (const [x, y] of L.timedPlates) {
    const c = L.cells[y][x];
    if (S.timer[c.plate] > 0) drawCountBadge(ox + x * cs, oy + y * cs, cs, S.timer[c.plate], PLATE_COL[c.plate]);
  }

  // refused-paradox warning: the endangered past self and the cell where it would break
  if (G.warn && now - G.warn.time < 1600 && G.mode === 'play') {
    const w = G.warn, a = 1 - (now - w.time) / 1600, pulse = 0.5 + 0.5 * Math.sin(now / 90);
    const g = G.ghosts[w.ghost];
    const rp = w.future !== undefined ? L.future[w.future][S.fidx[w.future]] : g ? posAt(g, ti) : null;
    if (rp) {
      const [gx, gy] = C(...rp);
      ctx.beginPath(); ctx.arc(gx, gy, cs * (0.4 + 0.05 * pulse), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,90,140,${a})`; ctx.lineWidth = 3; ctx.stroke();
    }
    const px = ox + w.pos[0] * cs, py = oy + w.pos[1] * cs;
    ctx.save();
    ctx.strokeStyle = `rgba(255,90,140,${a * (0.5 + 0.5 * pulse)})`; ctx.lineWidth = 3; ctx.setLineDash([6, 4]);
    ctx.strokeRect(px + 2, py + 2, cs - 4, cs - 4);
    ctx.restore();
  }
}

const WAVE_HOLD_MS = 1400, FADE_MS = 2200;
function drawRobot(cx, cy, r, it, now) {
  const [fx, fy] = it.face, holo = !it.present, col = holo ? it.col : '#dfe7f2';
  let blink = 1;
  if (it.hop !== undefined && it.hop < 800) {
    const q = it.hop / 800;
    cy -= Math.sin(q * Math.PI) * r * 0.45;
    if (q > 0.35 && q < 0.6) blink = 0.15;
  }
  ctx.save();
  if (holo) {
    ctx.globalAlpha = 0.78 + 0.18 * Math.sin(now / 170 + it.seed * 2);
    if (Math.random() < 0.03) cx += (Math.random() - 0.5) * r * 0.6;
  }
  const w = r * 1.9, h = r * 1.7, x = cx - w / 2, y = cy - h / 2 + r * 0.1;
  ctx.shadowColor = holo ? col : '#9fe8ff'; ctx.shadowBlur = holo ? 14 : 22;
  rr(x, y, w, h, r * 0.42);
  ctx.fillStyle = holo ? rgba(col, 0.3) : col; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2; ctx.strokeStyle = holo ? col : '#ffffff'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx + r * 0.18, y - r * 0.4);
  ctx.strokeStyle = holo ? col : '#c9d3e4'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + r * 0.18, y - r * 0.46, r * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = holo ? col : Math.floor(now / 500) % 2 ? '#ff4d5e' : '#6a2a35'; ctx.fill();
  const lx = cx + fx * r * 0.34, ly = y + h / 2 + fy * r * 0.22;
  ctx.beginPath(); ctx.arc(lx, ly, r * 0.5, 0, Math.PI * 2); ctx.fillStyle = '#0b1220'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(lx, ly, r * 0.3, r * 0.3 * blink, 0, 0, Math.PI * 2);
  ctx.fillStyle = holo ? col : '#7fe6ff'; ctx.fill();
  ctx.beginPath(); ctx.arc(lx - r * 0.1, ly - r * 0.1, r * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
  if (holo) {
    rr(x, y, w, h, r * 0.42); ctx.clip();
    ctx.fillStyle = 'rgba(7,9,15,0.4)';
    for (let yy = y + (now / 60) % 3; yy < y + h; yy += 3) ctx.fillRect(x, yy, w, 1);
  }
  ctx.restore();
}
// Xu Yao's recording: the only human figure in the game, in warm old-film amber.
function drawHuman(cx, cy, r, it, now) {
  const col = FUTURE_COL;
  ctx.save();
  ctx.globalAlpha = it.alpha * (0.8 + 0.15 * Math.sin(now / 130));
  if (Math.random() < 0.05 * (2 - it.alpha)) cx += (Math.random() - 0.5) * r * 0.7;
  const shape = () => {
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.68, r * 0.34, 0, Math.PI * 2);
    ctx.moveTo(cx - r * 0.34, cy - r * 0.22); ctx.lineTo(cx + r * 0.34, cy - r * 0.22);
    ctx.lineTo(cx + r * 0.6, cy + r * 0.95); ctx.lineTo(cx - r * 0.6, cy + r * 0.95); ctx.closePath();
  };
  ctx.shadowColor = col; ctx.shadowBlur = 18;
  ctx.fillStyle = rgba(col, 0.4); ctx.strokeStyle = col; ctx.lineWidth = 2;
  shape(); ctx.fill(); ctx.stroke();
  if (it.waving) {
    const ang = -Math.PI / 2 + 0.35 + Math.sin(now / 200) * 0.4, sx = cx + r * 0.3, sy = cy - r * 0.12;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(ang) * r * 0.9, sy + Math.sin(ang) * r * 0.9);
    ctx.lineCap = 'round'; ctx.lineWidth = Math.max(2, r * 0.16); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  shape(); ctx.clip();
  ctx.fillStyle = 'rgba(7,9,15,0.35)';
  for (let yy = cy - r * 1.05 + (now / 60) % 3; yy < cy + r * 0.95; yy += 3) ctx.fillRect(cx - r * 0.7, yy, r * 1.4, 1);
  for (let i = 0; i < 8; i++) {

  rr(wx, wy, ww, wh, wh * 0.3); ctx.fillStyle = '#0b0f1a'; ctx.fill();

  ctx.restore();
}

function drawStory(now) {

    const { starts } = logTiming(p.lines), lh = 34, n = p.lines.length;
    ctx.font = `500 19px ${MONO}`;
    const w = Math.max(...p.lines.map(l => ctx.measureText(l).width));
    const x0 = Math.round(VW / 2 - w / 2), top = VH / 2 - ((n - 1) * lh) / 2 - 20;
    ctx.textAlign = 'left';
    let cur = null;
    p.lines.forEach((ln, i) => {
      if (el < starts[i]) return;
      const shown = ln.slice(0, clamp(Math.floor((el - starts[i]) / LOG_CHAR_MS), 0, ln.length));
      ctx.fillStyle = ln.startsWith('「') ? FUTURE_COL : '#9fe8d0';
      ctx.fillText(shown, x0, top + i * lh);
      cur = [x0 + ctx.measureText(shown).width + 4, top + i * lh];
    });
    if (cur && Math.floor(now / 450) % 2) { ctx.fillStyle = '#9fe8d0'; ctx.fillRect(cur[0], cur[1] - 10, 10, 20); }
  } else if (p.style === 'chapter') {
    const fade = d => clamp((el - d) / 600, 0, 1), n = p.env.length, top = VH / 2 - 100;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(242,245,251,${fade(0)})`; ctx.font = `700 30px ${FONT}`; ctx.fillText(p.title, VW / 2, top);
    ctx.font = `400 20px ${FONT}`;
    p.env.forEach((ln, i) => { ctx.fillStyle = `rgba(195,203,224,${fade(600 + i * CH_LINE_MS)})`; ctx.fillText(ln, VW / 2, top + 64 + i * 38); });
    const sy = top + 64 + n * 38 + 36, a = fade(600 + n * CH_LINE_MS);
    if (p.signal && a > 0) {
      const [pct, txt] = p.signal, bw = 160, segs = 10, bx = VW / 2 - bw / 2;
      ctx.globalAlpha = a;
      ctx.font = `500 13px ${MONO}`; ctx.fillStyle = '#7a85a0'; ctx.fillText(`信号强度 ${pct}%`, VW / 2, sy);
      for (let i = 0; i < segs; i++) {
        ctx.fillStyle = i < Math.round(pct / 10) ? FUTURE_COL : '#2a3245';
        ctx.fillRect(bx + i * (bw / segs), sy + 16, bw / segs - 3, 4);
      }
      // a weak signal flickers; at full strength it holds still
      const weak = pct < 100;
      ctx.globalAlpha = a * (weak ? 0.7 + Math.random() * 0.3 : 1);
      ctx.font = `600 24px ${FONT}`; ctx.fillStyle = FUTURE_COL;
      ctx.fillText(`「${txt}」`, VW / 2 + (weak ? (Math.random() - 0.5) * 3 : 0), sy + 58);
      ctx.globalAlpha = 1;
    } else if (p.log && a > 0) {
      ctx.globalAlpha = a; ctx.font = `500 18px ${MONO}`; ctx.fillStyle = '#9fe8d0'; ctx.fillText(p.log, VW / 2, sy + 10);
      ctx.globalAlpha = 1;
    }
  } else {
    const n = p.lines.length, top = VH / 2 - ((n - 1) * 48) / 2 - 20;

    ctx.globalAlpha = 1;
  }
}

}

function drawFarewell(lay, now) {
  const w = G.fw, y = lay.oy + lay.cs * G.L.h + 30;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (!w.waved && now - w.start > 1400) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(now / 350);
    ctx.fillStyle = FUTURE_COL; ctx.font = `600 18px ${FONT}`; ctx.fillText('空格 · 挥手', VW / 2, y);
    ctx.globalAlpha = 1;
  }
  if (w.stop) { ctx.fillStyle = `rgba(0,0,0,${clamp((now - w.stop) / 1400, 0, 1)})`; ctx.fillRect(0, 0, VW, VH); }
}

function drawVHS() {
  ctx.fillStyle = 'rgba(0,0,0,0.13)';
  for (let y = 0; y < VH; y += 3) ctx.fillRect(0, y, VW, 1);
  const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  if (Math.random() < 0.06) {
    ctx.fillStyle = `rgba(255,255,255,${0.02 + Math.random() * 0.04})`;
    ctx.fillRect(0, Math.random() * VH, VW, 1 + Math.random() * 2);
  }
}

let lastNow = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;

  if (G.mode === 'play' || G.mode === 'fail') {
    const target = curTick();
    G.disp += (target - G.disp) * Math.min(1, dt * 16);
    if (Math.abs(target - G.disp) < 0.002) G.disp = target;
    if (G.mode === 'play' && curTick() >= G.L.T && now - G.lastActTime > 420) timeUp();
    // in the last level the tape keeps rolling while 47 holds the plate for her
    else if (G.mode === 'play' && G.L.autoWait && curTick() < G.L.T && presentOnPlate() &&
      !futureArrived(G.L, G.states[curTick()]) && now - G.lastActTime > 650) act('W');
  } else if (G.mode === 'rewind') {
    const p = (now - G.rewind.start) / G.rewind.dur;
    if (p >= 1) finishRewind();
    else G.disp = G.rewind.from * (1 - easeIO(p));
  } else if (G.mode === 'replay') {
    const r = G.replay;
    if (now < r.start) G.disp = r.ticks;
    else {
      const fr = ((now - r.start) / 1000) * r.speed;
      G.disp = Math.min(fr, r.ticks);
      if (fr > r.ticks + 1.4) toWon(now);
    }
  } else if (G.mode === 'won') {
    G.disp = G.replay.ticks;
  } else if (G.mode === 'farewell') {
    G.disp += (curTick() - G.disp) * Math.min(1, dt * 16);
    const w = G.fw;
    if (w.waved && !w.off && now - w.waved > WAVE_HOLD_MS + FADE_MS) { w.off = now; sfx.door(false); }
    if (w.off && !w.stop && now - w.off > 1300) { w.stop = now; sfx.tapeStop(); }
    if (w.stop && now - w.stop > 2200) nextLevel();
  } else if (G.mode === 'story' && G.story.page.style === 'log') {
    const { starts } = logTiming(G.story.page.lines), el = now - G.story.start;
    const n = G.story.page.lines.reduce((s, ln, i) => s + clamp(Math.floor((el - starts[i]) / LOG_CHAR_MS), 0, ln.length), 0);
    if (n > G.story.typed) { if (n % 2 === 0) sfx.type(); G.story.typed = n; }
  }
  if (hissGain) {
    const quiet = muted || (G.mode === 'farewell' && G.fw.stop);
    hissGain.gain.setTargetAtTime(quiet ? 0 : G.mode === 'rewind' ? 0.03 : 0.012, AC.currentTime, 0.15);
  }

  ctx.fillStyle = '#07090f'; ctx.fillRect(0, 0, VW, VH);

  if (G.mode === 'title') drawTitle(now);
  else if (G.mode === 'story') drawStory(now);
  else if (G.mode === 'end') drawEnd(now);
  else {
    const lay = layout();
    ctx.save();
    const sp = (now - G.shakeT) / 350;
    if (sp < 1) ctx.translate((Math.random() - 0.5) * 10 * (1 - sp), (Math.random() - 0.5) * 10 * (1 - sp));
    if (G.mode === 'rewind') ctx.translate((Math.random() - 0.5) * 6, 0);
    drawScene(G.disp, lay, now, dt);
    drawParticles(dt);
    ctx.restore();
    drawHUD(G.disp, now);

    if (G.mode === 'rewind') drawRewindFX(lay, now);
    if (G.mode === 'replay' && now >= G.replay.start) {
      ctx.font = `600 14px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const txt = `▶ 回放 · ${G.ghosts.length + 1} 卷磁带同时播放`;
      const w = ctx.measureText(txt).width + 32, y = lay.oy + lay.cs * G.L.h + 24;
      rr(VW / 2 - w / 2, y - 13, w, 26, 13); ctx.fillStyle = 'rgba(200,243,255,0.12)'; ctx.fill();
      ctx.fillStyle = '#c8f3ff'; ctx.fillText(txt, VW / 2, y);
    }

    const ls = now - G.levelShow, introDur = G.L.intro ? 3400 : 1700;
    if (G.mode === 'play' && ls < introDur) {
      const a = Math.min(1, ls / 200) * Math.min(1, (introDur - ls) / 500);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(7,9,15,0.8)'; ctx.fillRect(lay.ox, lay.oy, lay.cs * G.L.w, lay.cs * G.L.h);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const cy = lay.oy + (lay.cs * G.L.h) / 2;
      ctx.fillStyle = '#8a94ad'; ctx.font = `500 16px ${FONT}`; ctx.fillText(chapterShort(G.L.ch), VW / 2, cy - 30);
      ctx.fillStyle = '#ffffff'; ctx.font = `700 40px ${FONT}`; ctx.fillText(G.L.name, VW / 2, cy + 12);
      if (G.L.intro) {
        ctx.globalAlpha = a * clamp((ls - 900) / 500, 0, 1);
        ctx.fillStyle = '#c3cbe0'; ctx.font = `400 17px ${FONT}`; ctx.fillText(G.L.intro, VW / 2, cy + 56);
      }
      ctx.globalAlpha = 1;
    }

    drawBanner(lay, now);

    if (G.mode === 'won') drawTapeCard(now);
    else if (G.mode === 'fail') drawCard('磁带用完了', G.L.farewell ? '她还在门外等。' : '已经没有空白磁带了。', 'Z 倒带一格 · R 重来', '#ff9a9a');
    else if (G.mode === 'farewell') drawFarewell(lay, now);
  }
  drawVHS();
  requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script>
